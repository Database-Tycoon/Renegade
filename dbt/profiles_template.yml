renegade:
  outputs:
    dev:
      type: trino
      method: ldap 
      user: "{{ env_var('STARBURST_CLUSTER_USER') }}" 
      password: "{{ env_var('STARBURST_CLUSTER_PASSWORD') }}"
      host: "{{ env_var('STARBURST_CLUSTER_URL') }}"
      port: "{{ env_var('STARBURST_CLUSTER_PORT') | int }}"
      database: dbtycoon_renegade
      schema: dbt
      cert: true
  target: dev
